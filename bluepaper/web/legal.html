<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <title>{{TITLE}} — BluePaper</title>
    <link rel="icon" href="/ui/favicon-96x96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/ui/favicon.ico" />
    <link rel="apple-touch-icon" href="/ui/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/ui/site.webmanifest" />
    <script src="/ui/theme-boot.js"></script>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="frame">
      <header class="topbar">
        <a class="brand" href="https://bluethroatlabs.com/" target="_blank" rel="noopener noreferrer" aria-label="Bluethroat Labs website"><img src="/ui/assets/bluethroat-wordmark.svg" alt="Bluethroat Labs" width="198" height="32" /></a>
        <nav class="top-actions" aria-label="Main navigation">
          <a href="/#about">About</a>
          <a href="/#convert">Convert</a>
          <button id="theme" type="button" aria-label="Switch to light appearance" title="Switch to light appearance">
            <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42 1.42"/></svg>
            <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z"/></svg>
          </button>
        </nav>
      </header>
      <main id="content">
        <section class="intro" aria-labelledby="product-title">
          <div class="intro-inner">
            <a class="product-lockup" href="/" aria-label="BluePaper converter"><span class="product-mark" aria-hidden="true"><img src="/ui/favicon-96x96.png" alt="" width="88" height="88" /></span><h1 id="product-title">BluePaper</h1></a>
            <div class="intro-copy"><p>Rebuild from pixels</p><p>Turn an untrusted document into a PDF rebuilt from pixels.</p></div>
          </div>
        </section>
        <article class="legal-page" aria-labelledby="legal-title">
          <header class="legal-head"><h2 id="legal-title">{{TITLE}}</h2><a href="/">Back to converter</a></header>
          <div class="legal-copy">{{BODY}}</div>
        </article>
      </main>
      <footer class="page-footer">
        <div class="footer-brand"><span>A document tool by</span><a href="https://bluethroatlabs.com/" target="_blank" rel="noopener noreferrer"><img src="/ui/assets/bluethroat-wordmark.svg" alt="Bluethroat Labs" width="124" height="20" /></a></div>
        <nav class="footer-links" aria-label="Policies and support"><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/support">Support</a><a href="/docs">API</a><a href="https://github.com/BluethroatLabs/BluePaper">Corresponding source</a></nav>
      </footer>
    </div>
    <script src="/ui/theme.js" defer></script>
  </body>
</html>
