<!DOCTYPE html>
<!--
  Source for bluepaper/web/og-image.png (1200x630). Regenerate with:
  chrome --headless --hide-scrollbars --window-size=1200,630 \
    --screenshot=bluepaper/web/og-image.png assets/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #070707;
        color: #f2f2f2;
        font-family: "Geist Mono", ui-monospace, monospace;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        border: 1px solid #2e2e2e;
        display: flex;
        flex-direction: column;
      }

      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 84px;
        padding: 0 48px;
        border-bottom: 1px solid #2e2e2e;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .bar span {
        color: #9a9a9a;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hero {
        position: relative;
        flex: 1;
        overflow: hidden;
      }

      .texture {
        position: absolute;
        inset: 0;
        background-color: #121212;
        background-image:
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.45) 0, rgba(0, 0, 0, 0.45) 1px, transparent 1px, transparent 3px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0, rgba(255, 255, 255, 0.035) 1px, transparent 1px, transparent 4px),
          radial-gradient(circle at 30% 40%, #3a3a3a 0, transparent 42%),
          radial-gradient(circle at 70% 60%, #2a2a2a 0, transparent 38%);
      }

      .texture::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, #070707 0%, transparent 18%, transparent 82%, #070707 100%);
      }

      h1 {
        position: relative;
        margin: 0;
        padding: 56px 48px 0;
        font-family: "Instrument Serif", serif;
        font-size: 150px;
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: -0.02em;
      }

      h1 span {
        display: block;
        padding-left: 200px;
      }

      .caption {
        position: absolute;
        left: 48px;
        bottom: 40px;
        max-width: 620px;
        padding: 20px 24px;
        background: #070707;
        font-size: 22px;
        line-height: 1.45;
      }

      .caption em {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 1.25em;
      }

      .stat {
        position: absolute;
        right: 48px;
        bottom: 40px;
        text-align: right;
        color: #9a9a9a;
        font-size: 18px;
      }

      .stat b {
        display: block;
        color: #f2f2f2;
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 80px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bar">BluePaper <span>Bluethroat Labs</span></div>
      <div class="hero">
        <div class="texture"></div>
        <h1>Rebuild <span>from pixels</span></h1>
        <p class="caption">
          Untrusted document in, safe PDF out. Safety comes from
          <em>destruction</em>, not detection.
        </p>
        <p class="stat"><b>0</b>parsers on the trusted plane</p>
      </div>
    </div>
  </body>
</html>
